        <h1>Note 01: AI Agent 開發規則的重要性</h1>
        <p><strong>建立日期：</strong>2026-11-16</p>

        <hr>

        <h2>核心重點摘要</h2>
        <ul>
            <li>透過明確的 <code>AGENTS.md</code> 規範，讓 AI 理解專案目錄結構與命名邏輯。</li>
            <li>統一的排版與樣式（如 <code>style.css</code>）確保跨頁面的視覺一致性。</li>
            <li>標準化的新增流程使 AI 能自動更新首頁目錄，實現高效維護。</li>
        </ul>

        <h2>詳細說明</h2>
        <p>在進行 Vibe Coding 或與 AI 協同開發時，若缺乏統一的規範檔案，AI 容易在每次新增頁面時產生結構混亂或不合風格的程式碼。透過事先定義好檔案放置路徑、命名規則以及更新機制，能夠大幅提升專案的可擴充性與自動化維護效率。</p>
    </div>
